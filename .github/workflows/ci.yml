# CI: tests, lint, ASCII check (PLAN.md section 13.2).
#
# The evidence tests and the R packages are not run here: they need the
# fetch cache (several hundred megabytes of third-party sources) and an R
# installation. `specfirst gate <wp>` runs them on the owner's machine.
name: ci

on:
  push:
    branches: [main, "track/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Python environment from the lock file
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --no-deps \
            --require-hashes --only-binary=:all: -r env/requirements.lock
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --no-deps \
            --no-build-isolation -e .
      - name: ASCII check
        run: .venv/bin/python -m specfirst.asciicheck
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Unit tests
        run: .venv/bin/python -m pytest -m "not evidence" -q

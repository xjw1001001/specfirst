id: demo.baseline.record
unit: mod-demographics
applies_when: design.collects_vital_signs
question: Which record gives baseline weight and height?
alternatives:
  - id: last_on_or_before_first_dose
    statement: "Baseline weight and height are the last non-missing values on or before the treatment start date."
    definition: >-
      Of several values on the last date the highest VSSEQ is taken. A
      subject without a treatment start date has no baseline weight and
      height.
  - id: at_visit
    statement: "Baseline weight and height are the non-missing values at the visit {visit}."
    definition: Of several values at the visit the highest VSSEQ is taken.
    slots:
      visit: {type: text, examples: ["SCREENING 1", "Screening"]}
house_default: last_on_or_before_first_dose
compile: templates/demo.baseline.record.yaml
phrasings: phrasings/demo.baseline.record.yaml
reading: knowledge/demo.baseline.record.md
probes: [weight_at_screening_and_day_1]
sources:
  - ref: p7
    path: cdiscpilot01/spec/yamaa/adsl.yaml
    find: "VS.VSTESTCD='HEIGHT' and VS.VISITNUM=1"
    where: "HEIGHTBL of the pilot ADSL: the value of a named visit"
  - ref: adamig
    where: "ADSL baseline characteristics; BDS baseline record (ABLFL)"

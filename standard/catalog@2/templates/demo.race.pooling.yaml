entry: demo.race.pooling
alternatives:
  not_pooled:
    adam:
      ADSL:
        columns:
          - name: RACEGR1
            type: str
            label: Pooled Race Group 1
            derivation: RACE
  fixed_groups:
    adam:
      ADSL:
        columns:
          - name: RACEGR1
            type: str
            label: Pooled Race Group 1
            derivation:
              case:
                $concat:
                  - [{when: "RACE IS NULL OR RACE = ''", then: null}]
                  - $for: m
                    in: {$get: map}
                    do: {when: "RACE = ${m.race|q}", then: "${m.group|q}"}
                  - [{otherwise: "${other|q}"}]

id: tfl.quantile.definition
unit: tfl-demographics
applies_when: design.always
question: Which quantile definition gives the median and the quartiles?
alternatives:
  - id: sas5
    statement: "Quantiles in the demographics table follow SAS definition 5 (R type 2), the empirical distribution function with averaging."
  - id: r7
    statement: "Quantiles in the demographics table follow R type 7, linear interpolation of the order statistics."
notes: >-
  Only the demographics table can show quartiles (decision tfl.demog.stats);
  the vital signs table shows the median and no quartile, and both
  definitions give the same median.
compile: templates/tfl.quantile.definition.yaml
phrasings: phrasings/tfl.quantile.definition.yaml
reading: knowledge/tfl.quantile.definition.md
probes: [group_size_separating_quantiles]
sources:
  - ref: sas-pctldef
    where: "PCTLDEF=5, the default: empirical distribution function with averaging"
  - ref: r-quantile
    where: "type 7, the default; type 2 equals SAS definition 5"
  - ref: yamaa
    path: rules/formulas.md
    find: "type 7 of Hyndman and Fan"
    where: "FORMULA-18: a named quantile definition"

id: ae.teae.end
unit: mod-ae-emergence
applies_when: design.collects_adverse_events and design.has_exposure
question: When does treatment emergence end?
alternatives:
  - id: no_end
    statement: "Treatment emergence has no end date."
    definition: >-
      Every event that starts on or after the start of treatment emergence
      is treatment-emergent, however long after the treatment end date
      (the on-study reading of the FDA guide).
  - id: last_dose_plus_days
    statement: "Treatment emergence ends {days} days after the treatment end date, that day included."
    definition: >-
      An event that starts later than that many days after the treatment end
      date is not treatment-emergent; one that starts on the last day of the
      window still is.
    slots:
      days: {type: int, min: 0, examples: [30, 7]}
    sources:
      - ref: admiral
        where: "inst/templates/ad_adae.R, derive_var_trtemfl(end_window = 30); R/derive_var_trtemfl.R: flagged when on or before trt_end_date + end_window days"
        evidence: cited
fixed_rules:
  - id: no_end_date
    text: A subject without a treatment end date has no end of treatment emergence.
compile: templates/ae.teae.end.yaml
phrasings: phrasings/ae.teae.end.yaml
reading: knowledge/ae.teae.end.md
probes: [ae_starts_after_emergence_window]
sources:
  - ref: admiral
    where: "derive_var_trtemfl(), end_window: events starting more than the given days after end of treatment are not flagged"
  - ref: yamaa
    path: benchmarks/adam-adae-onset-emergence/spec.yaml
    find: "TEENDDTM"
    where: "the benchmark of treatment emergence timing: a window after last exposure"
  - ref: fda-stf
    where: "section 2.2, page 15: on-study versus on-treatment analyses (the review of #3, 2026-11-11)"
    evidence: cited

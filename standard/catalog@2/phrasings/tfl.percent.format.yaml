# Natural variants of each statement of this entry (PLAN.md sections 5.1 and 6.6).
entry: tfl.percent.format
alternatives:
  one_decimal_zero_blank:
    plain: "In {output}, the number of decimals shown in a percentage is {decimals}; when a count is zero, no percentage is shown with it."
    formal: "The number of decimal places of percentages in {output} shall be {decimals}; a count of zero shall be presented without a percentage."
    brief: "Percentages in {output}: decimals {decimals}; zero count shown without a percentage."
  one_decimal_always:
    plain: "In {output}, the number of decimals shown in a percentage is {decimals}; when a count is zero, its percentage is shown as well."
    formal: "The number of decimal places of percentages in {output} shall be {decimals}; a count of zero shall be presented with its percentage."
    brief: "Percentages in {output}: decimals {decimals}; zero count shown with its percentage."

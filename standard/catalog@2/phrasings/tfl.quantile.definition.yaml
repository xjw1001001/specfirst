# Natural variants of each statement of this entry (PLAN.md sections 5.1 and 6.6).
entry: tfl.quantile.definition
alternatives:
  sas5:
    plain: "In the demographics table, quantiles are computed by SAS definition 5 (R type 2), which is the empirical distribution function with averaging."
    formal: "Quantiles in the demographics table shall be calculated according to SAS definition 5, equal to R type 2 (empirical distribution function with averaging)."
    brief: "Quantiles in the demographics table: SAS definition 5 / R type 2 (empirical distribution function with averaging)."
  r7:
    plain: "In the demographics table, quantiles are computed by R type 7, which is linear interpolation of the order statistics."
    formal: "Quantiles in the demographics table shall be calculated according to R type 7 (linear interpolation of the order statistics)."
    brief: "Quantiles in the demographics table: R type 7 (linear interpolation of the order statistics)."

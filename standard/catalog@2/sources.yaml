# The public sources that catalog entries cite (PLAN.md sections 2.1 and 5.3).
#
# kind: pinned    a source of third_party/sources.yaml, fetched at its pinned
#                 commit. An entry names a file in it (`path`) and may name a
#                 text that must stand in that file (`find`). The gate checks
#                 both on the fetch cache.
# kind: document  a published standard, guideline or manual. An entry names
#                 the place in it (`where`). A script cannot check it: these
#                 citations are judged, not proven.
#
# `confirmed` says how the std-1 session confirmed a document source:
# "read" (the page was fetched and read on that date) or "cited" (cited by
# section from the published text, not fetched in the session).
sources:
  yamaa:
    kind: pinned
    title: yamaa, language documentation, rules and benchmarks
    source: yamaa
    license: MIT
  p7:
    kind: pinned
    title: R Consortium Submissions Pilot 7, yamaa specs and reviews of CDISCPILOT01
    source: p7
    license: MIT for code; study data excluded
  ars:
    kind: pinned
    title: CDISC Analysis Results Standard v1, model and examples
    source: ars
    license: MIT for code, CC BY 4.0 for content
  p6:
    kind: pinned
    title: R Consortium Submissions Pilot 6, CSR and SAP of CDISCPILOT01
    source: p6
    license: "no license file: cited by place, never copied"
  adamig:
    kind: document
    title: CDISC ADaM Implementation Guide
    version: "1.3"
    url: https://www.cdisc.org/standards/foundational/adam
    confirmed: cited
  occds:
    kind: document
    title: CDISC ADaM Structure for Occurrence Data (OCCDS)
    version: "1.1"
    url: https://www.cdisc.org/standards/foundational/adam
    confirmed: cited
  sdtmig:
    kind: document
    title: CDISC SDTM Implementation Guide
    version: "3.4"
    url: https://www.cdisc.org/standards/foundational/sdtmig
    confirmed: cited
  ich-e3:
    kind: document
    title: "ICH E3: Structure and Content of Clinical Study Reports"
    version: "1995"
    url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
    confirmed: cited
  ich-e9:
    kind: document
    title: "ICH E9: Statistical Principles for Clinical Trials"
    version: "1998"
    url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
    confirmed: read 2026-11-11 (sections 5.2.1 to 5.2.3 and 6.3, and the glossary)
  fda-stf:
    kind: document
    title: "FDA Standard Safety Tables and Figures: Integrated Guide"
    version: "2.0 (April 2025)"
    url: https://www.fda.gov/media/187065/download
    confirmed: >-
      cited: the sections, tables and pages are those the owner-side review of
      2026-11-11 opened (#14); no session of specfirst has read the guide
  admiral:
    kind: document
    title: admiral (pharmaverse), function reference and source
    version: main branch
    url: https://github.com/pharmaverse/admiral
    confirmed: read 2026-11-11 (R/derive_var_trtemfl.R, R/derive_vars_dt.R); other functions cited
  r-quantile:
    kind: document
    title: "R documentation, stats::quantile (types 1 to 9, after Hyndman and Fan 1996)"
    version: R 4.6
    url: https://stat.ethz.ch/R-manual/R-devel/library/stats/html/quantile.html
    confirmed: cited
  sas-pctldef:
    kind: document
    title: "SAS documentation, PROC UNIVARIATE, option PCTLDEF= (definitions 1 to 5)"
    version: SAS 9.4
    url: https://documentation.sas.com/doc/en/procstat/9.4/procstat_univariate_details14.htm
    confirmed: cited

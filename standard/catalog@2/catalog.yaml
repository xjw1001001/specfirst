# The decision catalog for the M1 families (PLAN.md section 5, appendix B).
#
# catalog@2 (ADR-020). A draft until catalog-2b merges, then frozen and
# tagged; standard/versions.yaml holds its status. What changed from
# catalog@1 is in migration.yaml, each line with its record of
# standard/BACKLOG.yaml. The defaults are not here: a house holds them
# (standard/houses/<house>@<n>/defaults.yaml).
catalog: specfirst-m1
version: 2
# The schema of the entry files (standard/schemas/).
entry_schema: catalog-entry.v1

# The defined terms of the statements (ADR-020, #18): each word has the
# meaning the named entry gives it, in every statement. The house standard
# prints the list once, before the first unit.
terms:
  treatment start date:
    entry: trt.start.source
    text: the date study treatment starts, from the exposure records as the entry says
  treatment end date:
    entry: trt.end.source
    text: the date study treatment ends, from the exposure records as the entry says
  randomized subject:
    entry: pop.randomized.rule
    text: a subject with a disposition record whose standardized term is RANDOMIZED, or, when the disposition data of the study hold no such record, with a planned arm code that is neither SCRNFAIL nor NOTASSGN
  safety set:
    entry: pop.safety.rule
    text: the subjects of the safety analyses, as the entry defines them
  study day:
    entry: date.studyday.origin
    text: the day counted from the origin the entry names, day 1 on that date and no day 0
  treatment-emergent:
    entry: ae.teae.start
    text: an adverse event that starts within treatment emergence, which ae.teae.start begins and ae.teae.end ends
  baseline:
    entry: bds.baseline.rule
    text: the value of a parameter that a change from baseline starts from; for weight and height in ADSL, as demo.baseline.record says
  post-baseline:
    entry: bds.baseline.rule
    text: a record dated after the treatment start date, or on that date and timed after the first dose when the baseline rule compares times

# The units that own decisions (PLAN.md section 10), in the order of the
# standard form. A table family has a phrase: how a statement names its
# output.
units:
  mod-treatment:
    kind: module
    title: Treatment and exposure
  mod-populations:
    kind: module
    title: Analysis populations and disposition
  mod-demographics:
    kind: module
    title: Demographics and baseline characteristics
  mod-ae-emergence:
    kind: module
    title: Adverse event emergence
  mod-bds-visits:
    kind: module
    title: Baseline and analysis visits
  tfl-demographics:
    kind: table_family
    title: Table of demographic and baseline characteristics
    phrase: the demographics table
  tfl-ae-summary:
    kind: table_family
    title: Summary table of adverse events
    phrase: the adverse event summary table
  tfl-ae-soc-pt:
    kind: table_family
    title: Table of adverse events by system organ class and preferred term
    phrase: the adverse event table by system organ class and preferred term
  tfl-vitals-by-visit:
    kind: table_family
    title: Table of vital signs by visit
    phrase: the vital signs table by visit

# What `applies_when` may name (PLAN.md section 6.2). A predicate joins
# these names with `and`, `or`, `not` and parentheses.
design_features:
  design.always: True for every study.
  design.randomized: Subjects are allocated to arms by randomization.
  design.multiple_arms: The study has two or more arms.
  design.has_exposure: Study treatment is given and its exposure is collected (EX).
  design.has_efficacy_set: The study defines an efficacy-evaluable population.
  design.collects_adverse_events: Adverse events are collected (AE).
  design.collects_vital_signs: Vital signs are collected (VS).
  design.has_bds_parameters: Repeated measurements are analyzed by parameter and visit.
  design.fixed_visits: Visits are scheduled on target study days.
  design.unscheduled_visits: Unscheduled visits can occur.

# The entries, in the order of the standard form. One file each in entries/.
entries:
  - trt.planned.source
  - trt.actual.source
  - trt.start.source
  - trt.end.source
  - trt.date.imputation
  - date.studyday.origin
  - pop.randomized.rule
  - pop.safety.rule
  - pop.safety.grouping
  - pop.efficacy.rule
  - disp.status.record
  - demo.age.groups
  - demo.race.pooling
  - demo.baseline.record
  - demo.bmi.rule
  - ae.start.imputation
  - ae.teae.start
  - ae.teae.end
  - ae.related.values
  - bds.baseline.rule
  - bds.window.table
  - bds.window.tiebreak
  - bds.unscheduled.use
  - bds.eot.record
  - tfl.output.include
  - tfl.population
  - tfl.columns.arms
  - tfl.columns.total
  - tfl.denominator
  - tfl.percent.format
  - tfl.quantile.definition
  - tfl.rounding.rule
  - tfl.decimals.rule
  - tfl.pvalue.format
  - tfl.demog.rows
  - tfl.demog.stats
  - tfl.tests.include
  - tfl.ae.summary.rows
  - tfl.ae.socpt.sort
  - tfl.ae.socpt.threshold
  - tfl.ae.socpt.counts
  - tfl.vs.scope
  - tfl.vs.layout

# Entries of appendix B that this draft leaves out, with the reason. They
# return with the table family or the data that makes them identifiable
# (PLAN.md section 4.6, property P4).
deferred:
  ae.teae.worsening: >-
    Needs the severity before treatment, which the SDTM domains of M1 (DM,
    DS, EX, AE, VS, SV) do not hold: the public sources use a sponsor
    variable (admiral, initial_intensity) or Findings About records (yamaa
    benchmark adam-adae-worsening-emergence).
  ae.severity.worst: >-
    No table family of M1 prints severity by term, so no alternative can
    change a result.
  ae.occurrence.flags: >-
    The M1 tables count subjects from the records themselves, so the flags
    change no result. The house parent spec of ADAE adds AOCCFL, AOCCSFL and
    AOCCPFL as conformance variables.
  disp.reason.source: >-
    No table family of M1 prints the reason for discontinuation. The house
    parent spec of ADSL adds DCSREAS from DSDECOD as a conformance variable.
deferred_alternatives:
  bds.baseline.rule/mean_of_predose_records: >-
    Needs a derived record (DTYPE AVERAGE) built by aggregation; kept for
    std-2 together with its yamaa row template.
  bds.window.tiebreak/average: >-
    Needs a derived record (DTYPE AVERAGE) per analysis visit; kept for
    std-2 together with its yamaa row template.

# Alternatives without a public source of their own: none in catalog@2. The
# three of catalog@1 went at the owner's answer of 2026-11-21 (ADR-020,
# question 3): ae.teae.end/end_of_study removed (#3),
# tfl.ae.socpt.sort/descending_frequency_highest_dose replaced by a sourced
# alternative (#9), demo.race.pooling/pooled_below_count replaced by a
# stated map (#21).
unsourced_alternatives: {}

# House standard open-default@2: parent spec of ADSL, one record per subject.
#
# This layer holds what no decision changes. It reads columns that decisions
# own (TRT01P, TRTSDT, SAFFL and the working values whose names start with
# an underscore); the compiler adds one fragment per decision that writes
# them. The compiled entry spec sets the paths and the output columns.
# Variable names follow ADaMIG 1.3.
yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM:
    path: ../sdtm/dm.parquet
    relative_to: entry
  EX:
    path: ../sdtm/ex.parquet
    relative_to: entry
    key: [STUDYID, USUBJID]
  VS:
    path: ../sdtm/vs.parquet
    relative_to: entry
  DS:
    path: ../sdtm/ds.parquet
    relative_to: entry
  SV:
    path: ../sdtm/sv.parquet
    relative_to: entry
base: DM

# Randomization (ADR-020, #10): the disposition record RANDOMIZED of the
# subject, and whether the study has any (keyed by STUDYID alone), so that
# the planned arm code decides only when the disposition data hold none.
intermediates:
  - id: DS_RAND
    dataset: DS
    key: [STUDYID, USUBJID]
    filter: "DS.DSDECOD = 'RANDOMIZED'"
    order_by: [DS.DSSEQ]
    keep: first
  - id: DS_RANDSTUDY
    dataset: DS
    key: [STUDYID]
    filter: "DS.DSDECOD = 'RANDOMIZED'"
    order_by: [DS.USUBJID, DS.DSSEQ]
    keep: first

output:
  path: adsl.parquet
  relative_to: entry
  columns: [STUDYID, USUBJID]
  order_by: [USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM.SUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

  - name: AGE
    type: float
    label: Age
    derivation: DM.AGE

  - name: AGEU
    type: str
    label: Age Units
    derivation: DM.AGEU

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

  - name: ETHNIC
    type: str
    label: Ethnicity
    derivation: DM.ETHNIC

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation: DM.ARM

  - name: ARMCD
    type: str
    label: Planned Arm Code
    derivation: DM.ARMCD

  - name: ACTARM
    type: str
    label: Description of Actual Arm
    derivation: DM.ACTARM

  - name: RFSTDTC
    type: str
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  - name: _RANDSEQ
    type: int
    label: "Working value: sequence number of the subject's disposition record RANDOMIZED"
    derivation: DS_RAND.DSSEQ

  - name: _RANDSTUDYSEQ
    type: int
    label: "Working value: the disposition data of the study hold a record RANDOMIZED"
    derivation: DS_RANDSTUDY.DSSEQ

  - name: RANDFL
    type: str
    label: Randomized Population Flag
    derivation:
      case:
        - when: "_RANDSEQ IS NOT NULL"
          then: "'Y'"
        - when: "_RANDSTUDYSEQ IS NOT NULL"
          then: "'N'"
        - when: "ARMCD IS NOT NULL AND ARMCD <> '' AND ARMCD NOT IN ('SCRNFAIL', 'NOTASSGN')"
          then: "'Y'"
        - otherwise: "'N'"

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation:
      impute:
        type: date
        source: DS_RAND.DSSTDTC
        invalid: null

  - name: EOSDT
    type: date
    label: End of Study Date
    derivation:
      impute:
        type: date
        source: _EOSDTC
        invalid: null

  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "_EOSDECOD = 'SCREEN FAILURE'"
          then: null
        - when: "_EOSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - when: "_EOSDECOD IS NOT NULL AND _EOSDECOD <> ''"
          then: "'DISCONTINUED'"
        - otherwise: "'ONGOING'"

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      case:
        - when: "EOSSTT = 'DISCONTINUED'"
          then: _EOSDECOD
        - otherwise: null

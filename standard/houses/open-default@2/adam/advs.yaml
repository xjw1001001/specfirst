# House standard open-default@2: parent spec of ADVS, the vital signs
# analysis dataset in the basic data structure.
#
# This layer holds what no decision changes. It reads columns that decisions
# own (ADY and the working values _ELIG, _PRE, _AVISITPB, _AVISITNPB,
# _AWTARGET and _ANLRN); the compiler adds one fragment per decision that
# writes them. Variable names follow ADaMIG 1.3.
#
# Rows. The template `collected` gives one row per vital signs record. The
# decision bds.eot.record may add the template `eot`, which repeats one
# collected record per subject and parameter as the end-of-treatment record.
# _ROWKIND tells the two kinds of rows apart.
#
#   baseline      the last row with _PRE = 'Y' among the eligible rows
#   post-baseline a row dated after the treatment start date, or on that date,
#                 not before the first dose (_PRE = N) and timed at or after a
#                 timed first dose (ADR-020, #6)
#   AVISIT        End of Treatment, Baseline, or the visit of the decision
#                 bds.window.table for an eligible post-baseline row
#   ANL01FL       the baseline row, the end-of-treatment row, and the row
#                 that the decision bds.window.tiebreak ranks first
yamaa: "1.0"
type: spec
model: ADaM
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ, DTYPE]
input:
  VS:
    path: ../sdtm/vs.parquet
    relative_to: entry
  ADSL:
    path: adsl.parquet
    relative_to: entry
    schema: adsl.yaml
    key: [STUDYID, USUBJID]
base: VS

# The unit of a parameter: the first non-missing standard unit of the test in
# the study, so that PARAM is one text per PARAMCD (ADaMIG; ADR-020, #17).
intermediates:
  - id: VS_UNIT
    dataset: VS
    key: {STUDYID: STUDYID, VSTESTCD: PARAMCD}
    filter: "VS.VSSTRESU IS NOT NULL AND VS.VSSTRESU <> ''"
    order_by: [VS.VSSEQ]
    keep: first

output:
  path: advs.parquet
  relative_to: entry
  columns: [STUDYID, USUBJID, VSSEQ, DTYPE]
  order_by: [USUBJID, PARAMCD, VSSEQ, DTYPE]

columns:
  - name: _ROWKIND
    type: str
    label: "Working value: COLLECTED or EOT"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: DTYPE
    type: str
    label: Derivation Type
    derivation:
      case:
        - when: "_ROWKIND = 'EOT'"
          then: "'LOV'"
        - otherwise: "''"  # not null: DTYPE is a key of ADVS (ADR-020, #17)

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation: ADSL.ITTFL

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation: ADSL.TRTSDTM

  - name: _TRTSTMF
    type: str
    label: "Working value: time imputation flag of the first exposure"
    derivation: ADSL.TRTSTMF

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT

  - name: _RFSTDTC
    type: str
    label: "Working value: subject reference start date text"
    derivation: ADSL.RFSTDTC

  - name: _RFSTDT
    type: date
    label: "Working value: subject reference start date"
    derivation:
      impute:
        type: date
        source: _RFSTDTC
        invalid: null

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: VS.VSTESTCD

  # PARAM with the unit, AVALU from the standard unit (ADR-020, #17).
  - name: AVALU
    type: str
    label: Analysis Value Unit
    derivation:
      case:
        - when: "VS.VSSTRESU IS NULL OR VS.VSSTRESU = ''"
          then: null
        - otherwise: VS.VSSTRESU

  - name: _PARAMU
    type: str
    label: "Working value: the test name with the unit of its parameter"
    derivation:
      str_template: {template: "{VS.VSTEST} ({VS_UNIT.VSSTRESU})", missing: null}

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      case:
        - when: "_PARAMU IS NULL"
          then: VS.VSTEST
        - otherwise: _PARAMU

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

  - name: VISIT
    type: str
    label: Visit Name
    derivation: VS.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: VS.VISITNUM

  - name: _VISITDY
    type: float
    label: "Working value: planned study day of the visit"
    derivation: VS.VISITDY

  - name: _DTC
    type: str
    label: "Working value: collected date and time text"
    derivation: VS.VSDTC

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      impute:
        type: date
        source: _DTC
        invalid: null

  - name: _DTPREC
    type: str
    label: "Working value: collected precision of the date and time"
    derivation:
      precision:
        type: datetime
        source: _DTC
        invalid: null

  - name: _TIMED
    type: str
    label: "Working value: the record has a collected time"
    derivation:
      flag:
        condition: "_DTPREC IN ('hour', 'minute', 'second')"
        false_value: N
        missing: N

  - name: _ADTM
    type: datetime
    label: "Working value: analysis date and time, 00:00 without a collected time"
    derivation:
      impute:
        type: datetime
        source: _DTC
        time: first
        invalid: null

  - name: _SCHED
    type: str
    label: "Working value: the visit is scheduled"
    derivation:
      flag:
        # bds.unscheduled.use, fixed rule unscheduled_visit (ADR-020, #21)
        condition: "_VISITDY IS NOT NULL AND (VISIT IS NULL OR VISIT NOT LIKE '%UNSCHED%')"
        false_value: N
        missing: N

  # Post-baseline is time-aware the way the baseline rule is (ADR-020, #6): a
  # record on the treatment start date that is not before the first dose and
  # was timed at or after a timed first dose is post-baseline, so that no
  # record falls between baseline and post-baseline.
  - name: _POST
    type: str
    label: "Working value: the record is post-baseline"
    derivation:
      flag:
        condition: "ADT > TRTSDT OR (ADT = TRTSDT AND _PRE = 'N' AND _TIMED = 'Y' AND _TRTSTMF IS NULL AND _ADTM >= TRTSDTM)"
        false_value: N
        missing: N

  - name: _BLCAND
    type: str
    label: "Working value: the record may be baseline"
    derivation:
      flag:
        condition: "_ROWKIND = 'COLLECTED' AND _PRE = 'Y' AND _ELIG = 'Y' AND AVAL IS NOT NULL"
        false_value: N
        missing: N

  - name: _BLRN
    type: int
    label: "Working value: order among the baseline candidates, last first"
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, PARAMCD]
          order_by:
            - {variable: _DTC, direction: desc}
            - {variable: VSSEQ, direction: desc}
          filter: "_BLCAND = 'Y'"

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      flag: "_BLRN = 1"

  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "MAX(AVAL)"

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "_POST = 'Y' AND AVAL IS NOT NULL AND BASE IS NOT NULL"
          then: "AVAL - BASE"
        - otherwise: null

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      case:
        - when: "_ROWKIND = 'EOT'"
          then: "'End of Treatment'"
        - when: "ABLFL = 'Y'"
          then: "'Baseline'"
        - when: "_POST = 'Y' AND _ELIG = 'Y'"
          then: _AVISITPB
        - otherwise: null

  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation:
      case:
        - when: "_ROWKIND = 'EOT'"
          then: 9999
        - when: "ABLFL = 'Y'"
          then: 0
        - when: "_POST = 'Y' AND _ELIG = 'Y'"
          then: _AVISITNPB
        - otherwise: null

  - name: _AWDIFF
    type: float
    label: "Working value: distance of the study day from the target day"
    derivation: "ABS(ADY - _AWTARGET)"

  - name: _EOTCAND
    type: str
    label: "Working value: the record may be the end-of-treatment value"
    derivation:
      flag:
        condition: "_POST = 'Y' AND _ELIG = 'Y' AND AVAL IS NOT NULL AND (TRTEDT IS NULL OR ADT <= TRTEDT)"
        false_value: N
        missing: N

  - name: _ANLCAND
    type: str
    label: "Working value: the record competes within its analysis visit"
    derivation:
      flag:
        condition: "_ROWKIND = 'COLLECTED' AND _POST = 'Y' AND _ELIG = 'Y' AND AVAL IS NOT NULL AND AVISIT IS NOT NULL"
        false_value: N
        missing: N

  - name: ANL01FL
    type: str
    label: Analysis Flag 01
    derivation:
      flag: "ABLFL = 'Y' OR _ROWKIND = 'EOT' OR _ANLRN = 1"

rows:
  - id: collected
    dataset: VS
    derivations:
      _ROWKIND: "'COLLECTED'"

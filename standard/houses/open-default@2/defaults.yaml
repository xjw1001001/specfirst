# The defaults of the house standard open-default@2 (ADR-020, decision 2).
#
# One item per entry of the catalog it needs, in catalog order: the
# alternative (`rule`; null: no default, the documents state it or a
# person is asked), the slot values it needs (`values`) and the public
# source of the choice (`sources`). An entry answered per table family
# has one item per unit under `units`. In place of `rule`, `cases` lists
# choices by design: each but the last has `when`, a predicate over the
# design features of the catalog; the first that holds is the default.
# Schema: standard/schemas/house-defaults.schema.json.
house: open-default@2
catalog: catalog@2
defaults:
  trt.planned.source: {rule: dm_arm}
  trt.actual.source: {rule: dm_actarm}
  trt.start.source: {rule: first_ex_with_dose}
  trt.end.source: {rule: last_ex_end_date}
  trt.date.imputation: {rule: not_completed}
  date.studyday.origin: {rule: treatment_start}
  pop.randomized.rule: {rule: all_randomized}
  pop.safety.rule:  # #2: randomized and dosed when the study randomizes
    cases:
      - when: design.randomized
        rule: randomized_and_dosed
        sources:
          - {ref: p7, path: cdiscpilot01/spec/yamaa/adsl.yaml, find: "Y if ITTFL='Y' and TRTSDT ne missing", where: "SAFFL of the pilot ADSL: randomized and dosed"}
          - {ref: fda-stf, where: "section 2.1.1, page 5: all subjects exposed to at least one dose of randomized treatment, one reading of an ambiguous sentence (the review of #2, 2026-11-11)", evidence: cited}
      - rule: at_least_one_dose
        sources:
          - {ref: ich-e9, where: "section 6.3: the safety set, subjects who received at least one dose"}
  pop.safety.grouping: {rule: actual}
  pop.efficacy.rule: {rule: null}
  disp.status.record: {rule: disposition_event}
  demo.age.groups:  # #7
    rule: lt65_ge65
    sources:
      - {ref: ars, path: "workfiles/examples/ARS v1/Common Safety Displays.json", where: "grouping AnlsGrouping_03_AgeGp on AGEGR1: < 65 years and >= 65 years"}
  demo.race.pooling: {rule: not_pooled}
  demo.baseline.record:  # #6: the same rule as the baseline of ADVS
    rule: last_on_or_before_first_dose
    sources:
      - {ref: admiral, where: "inst/templates/ad_advs.R: ABLFL the last record with ADT <= TRTSDT, a date comparison (the review of #6, 2026-11-11)", evidence: cited}
  demo.bmi.rule: {rule: derived}
  ae.start.imputation: {rule: first_of_month_not_before_first_dose}
  ae.teae.start: {rule: on_or_after_first_dose_date}
  ae.teae.end:  # #3
    rule: last_dose_plus_days
    values: {days: 30}
    sources:
      - {ref: admiral, where: "inst/templates/ad_adae.R: derive_var_trtemfl(trt_end_date = TRTEDT, end_window = 30) (the review of #3, 2026-11-11)", evidence: cited}
  ae.related.values: {rule: null}
  bds.baseline.rule:  # #6
    rule: last_on_or_before_first_dose_date
    sources:
      - {ref: admiral, where: "inst/templates/ad_advs.R: ABLFL the last record by ADT, VISITNUM, VSSEQ with ADT <= TRTSDT (the review of #6, 2026-11-11)", evidence: cited}
  bds.window.table: {rule: nominal_visit}
  bds.window.tiebreak:  # #11
    rule: last_record
    sources:
      - {ref: admiral, where: "inst/templates/ad_advs.R: ANL01FL the last record per USUBJID, PARAMCD, AVISIT, ATPT, DTYPE by ADT and AVAL, AVISIT from VISIT (the review of #11, 2026-11-11)", evidence: cited}
  bds.unscheduled.use: {rule: compete}
  bds.eot.record: {rule: last_on_treatment_value}
  tfl.output.include:
    units:
      tfl-demographics: {rule: included}
      tfl-ae-summary: {rule: included}
      tfl-ae-soc-pt: {rule: included}
      tfl-vitals-by-visit: {rule: included}
  tfl.population:
    units:
      tfl-demographics: {rule: randomized}
      tfl-ae-summary: {rule: safety}
      tfl-ae-soc-pt: {rule: safety}
      tfl-vitals-by-visit: {rule: safety}
  tfl.columns.arms:
    units:
      tfl-demographics: {rule: ascending_dose_placebo_first}
      tfl-ae-summary: {rule: ascending_dose_placebo_first}
      tfl-ae-soc-pt: {rule: ascending_dose_placebo_first}
      tfl-vitals-by-visit: {rule: ascending_dose_placebo_first}
  tfl.columns.total:
    units:
      tfl-demographics:  # #8
        rule: all_arms
        sources:
          - {ref: fda-stf, where: "Table 2, page 8: the column Total Population (the review of #8, 2026-11-11)", evidence: cited}
      tfl-ae-summary: {rule: none}
      tfl-ae-soc-pt: {rule: none}
      tfl-vitals-by-visit: {rule: none}
  tfl.denominator: {rule: analysis_set_per_column}
  tfl.percent.format:
    units:
      tfl-demographics: {rule: one_decimal_always, values: {decimals: 1}, sources: [{ref: ars, path: "workfiles/examples/ARS v1/Common Safety Displays.json", where: "every count of 0 with its formatted percentage (  0.0), one decimal"}]}  # #1
      tfl-ae-summary: {rule: one_decimal_always, values: {decimals: 1}, sources: [{ref: ars, path: "workfiles/examples/ARS v1/Common Safety Displays.json", where: "every count of 0 with its formatted percentage (  0.0), one decimal"}]}
      tfl-ae-soc-pt: {rule: one_decimal_always, values: {decimals: 1}, sources: [{ref: ars, path: "workfiles/examples/ARS v1/Common Safety Displays.json", where: "every count of 0 with its formatted percentage (  0.0), one decimal"}]}
  tfl.quantile.definition: {rule: sas5}  # #22: the demographics table only
  tfl.rounding.rule:
    units:
      tfl-demographics: {rule: half_away_from_zero}
      tfl-ae-summary: {rule: half_away_from_zero}
      tfl-ae-soc-pt: {rule: half_away_from_zero}
      tfl-vitals-by-visit: {rule: half_away_from_zero}
  tfl.decimals.rule:
    units:
      tfl-demographics: {rule: relative_to_data}
      tfl-vitals-by-visit: {rule: relative_to_data}
  tfl.pvalue.format: {rule: three_decimals}
  tfl.demog.rows: {rule: null}
  tfl.demog.stats: {rule: n_mean_sd_median_min_max}
  tfl.tests.include: {rule: none}
  tfl.ae.summary.rows: {rule: standard_rows}
  tfl.ae.socpt.sort: {rule: alphabetical}
  tfl.ae.socpt.threshold: {rule: none}
  tfl.ae.socpt.counts: {rule: subjects}
  tfl.vs.scope: {rule: null}
  tfl.vs.layout: {rule: side_by_side}

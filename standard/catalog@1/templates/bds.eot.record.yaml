entry: bds.eot.record
alternatives:
  last_on_treatment_value:
    adam:
      ADVS:
        columns:
          - name: _EOTRN
            type: int
            label: "Working value: order among the end-of-treatment candidates, last first"
        rows:
          - id: collected
            derivations:
              _EOTRN: null
          - id: eot
            dataset: VS
            group_by: [VS.STUDYID, VS.USUBJID, VS.VSSEQ, VS.VSTESTCD, VS.VSTEST,
                       VS.VSSTRESN, VS.VSDTC, VS.VISIT, VS.VISITNUM, VS.VISITDY]
            filter: "_EOTRN = 1"
            derivations:
              _ROWKIND: "'EOT'"
              _EOTRN:
                row_number:
                  window:
                    group_by: [STUDYID, USUBJID, PARAMCD]
                    order_by:
                      - {variable: _DTC, direction: desc}
                      - {variable: VSSEQ, direction: desc}
                    filter: "_EOTCAND = 'Y'"
  none: {}

entry: bds.baseline.rule
alternatives:
  last_before_first_dose:
    adam:
      ADVS:
        columns:
          - name: _PRE
            type: str
            label: "Working value: the record is before the first dose"
            derivation:
              flag:
                condition: "ADT < TRTSDT OR (ADT = TRTSDT AND (_TIMED = 'N' OR _TRTSTMF IS NOT NULL OR _ADTM < TRTSDTM))"
                false_value: N
                missing: N
  last_on_or_before_first_dose_date:
    adam:
      ADVS:
        columns:
          - name: _PRE
            type: str
            label: "Working value: the record is on or before the treatment start date"
            derivation:
              flag: {condition: "ADT <= TRTSDT", false_value: N, missing: N}
  scheduled_baseline_visit:
    adam:
      ADVS:
        columns:
          - name: _PRE
            type: str
            label: "Working value: the record is of the scheduled baseline visit"
            derivation:
              flag: {condition: "VISIT = ${visit|q}", false_value: N, missing: N}

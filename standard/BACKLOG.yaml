  - {id: i02.safety-by-design, issue: 2, layer: house, target: pop.safety.rule (default),
     kind: change a default, status: done, version: open-default@2, adr: ADR-020,
     reason: "randomized and dosed when the study randomizes, dosed otherwise (a default by design)"}
  - {id: i02.fda-wording, issue: 2, layer: catalog, target: knowledge/pop.safety.rule.md,
     kind: fix a reading note, status: done, version: catalog@2, adr: ADR-020}

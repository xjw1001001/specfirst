# The review backlog of the standard (ADR-020, decision 5; issue #28).
#
# One record per proposed change of the catalog, a house, a schema, the
# documents or the code of the standard. The issue keeps the discussion;
# the record keeps the state. `specfirst status` prints what is open,
# accepted and waiting, by layer; the gate check "backlog" holds the file
# (specfirst.compile.backlog). A line of a migration file names the record
# that accepted it.
#
#   status   open | accepted | done | waits | rejected
#   version  accepted, done: the version label (standard/versions.yaml)
#   for      waits: the work package or track it waits for
#
# The records start with the two tables of ADR-020, decision 7, after the
# owner's answers of 2026-11-21 (A to questions 1, 2, 3 and 5, B to 4). The
# layer of each record is taken from the issue's text, not its title (#28,
# item 5).
records:
  # #1 how a count of zero is shown (tfl.percent.format)
  - {id: i01.zero-shown, issue: 1, layer: house, target: tfl.percent.format (default),
     kind: change a default, status: done, version: open-default@2, adr: ADR-020,
     reason: "a percentage for every count, 0 shown as 0 (0.0); the owner's answer to question 2"}
  - {id: i01.decimals-slot, issue: 1, layer: catalog, target: tfl.percent.format,
     kind: add a slot, status: done, version: catalog@2, adr: ADR-020,
     reason: "the decimals of a percentage, 0 to 2, in both alternatives"}
  - {id: i01.below-one, issue: 1, layer: catalog, target: tfl.percent.format,
     kind: add an alternative, status: waits, for: real-4 and std-2, adr: ADR-020,
     reason: "the display (<1%) comes with the table work"}

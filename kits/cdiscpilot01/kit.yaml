# Kit manifest of CDISCPILOT01 (PLAN.md sections 6.1 and 8; tier C, real data).
#
# This folder holds no study data and no study document (rule 4 of section
# 2.1, E20). Every file of the kit is named below by pinned source, path and
# SHA-256. `specfirst kit assemble cdiscpilot01` copies them from the fetch
# cache into build/kits/cdiscpilot01/ and refuses any file whose hash is not
# the one written here. `specfirst kit lock cdiscpilot01` rewrites the hashes
# after a pin has changed on purpose.
#
# Inputs are what an agent may read. Gold is never placed in an agent's
# workspace. See README.md in this folder for the layout.
kit: 0
id: cdiscpilot01
title: "CDISCPILOT01, the CDISC SDTM/ADaM pilot study, as staged by Pilot 7"
tier: C

pins:
  engines:
    yamaa: "0.7.0"
  sources:
    p7: 213cb6ab3adc51abe4295cbbc546c0e6d46c3df8
    ars: 2c9b4b68724386e8f91dc576724855af7fafac65
    # Pilot 6: the CSR, the reference of the efficacy grids (real-5a, ADR-015).
    p6: a4f85c95cfef1f6aa27795362630f8ae43210185

build:
  # The yamaa project that builds the ADaM datasets (ADR-001).
  project: gold/spec/cdiscpilot01/spec/yamaa/project.yaml
  # A specification's input is the file of the same name in this folder,
  # unless another specification of the project produces it.
  sdtm: inputs/data/sdtm
  # The reference ADaM: <dataset>.parquet, compared cell by cell (P2).
  reference: gold/reference/adam
  # Pilot 7's reviewed claims: <dataset>-claims.json, imported as candidate
  # cites edges.
  claims: gold/claims
  # Our own file, in this folder: every difference between our results and a
  # reference, with its class and its proof (PLAN.md section 4.8, ADR-002).
  exceptions: gold/exceptions.yaml
  # Our own file, in this folder: the decision records of the efficacy tables of
  # real-5a, custom decisions (custom:<slug>) until catalog@2 (PLAN.md section 10,
  # ADR-012 decision 2, ADR-015).
  decisions: gold/decisions/efficacy.jsonl

# The ARS reporting events whose analyses the result engines run on the ADaM
# datasets of the build (ADR-002).
results:
  # CDISC's ARS v1 example "Common Safety Displays": 5 outputs, 31 analyses,
  # as fetched. The 3,735 results it embeds are a reference (E2, E3).
  - id: common-safety-displays
    ars: gold/spec/ars/common-safety-displays.json
    # The JSON Schema generated from the ARS model, from the same repository.
    schema: gold/spec/ars/ars_ldm.schema.json
    subject_key: USUBJID
    # The example names its operations in words. Its three tests all call
    # their operation "P-value", so they are bound here (binding rule B1).
    # The others are found by their names (rule B3): "Count of subjects",
    # "Percent of subjects", "Mean" and so on.
    binding:
      operations:
        Mth03_CatVar_Comp_PChiSq_1_pval: {method: test.chisq, operation: p_value}
        Mth04_ContVar_Comp_Anova_1_pval: {method: test.anova.oneway, operation: p_value}
        Mth03_CatVar_Comp_FishEx_1_pval: {method: test.fisher.exact, operation: p_value}
      # What the example leaves to code, stated: the SAS default for quantiles
      # (E4: with the R default 49 more results differ).
      options:
        summary.continuous: {quantile_definition: sas5}
    # The outputs of the event that are built as grids, each with its layout: a
    # file of our own in this folder (ADR-003). The list is the limit of the
    # display checks. real-3a builds the adverse event summary (ADR-005); issue #31
    # the demographics and the table by organ class and term (ADR-022); the rest of
    # real-3 adds the vital signs.
    outputs:
      - id: Out14-1-1
        layout: gold/layout/Out14-1-1.yaml
      - id: Out14-3-1-1
        layout: gold/layout/Out14-3-1-1.yaml
      - id: Out14-3-2-1
        layout: gold/layout/Out14-3-2-1.yaml
  # real-5a (ADR-012, ADR-015): ADAS-Cog (11), change from baseline to weeks 24, 8
  # and 16, LOCF, by ANCOVA. The reporting event is our own file, written from the
  # SAP, the analysis results metadata of the Define-XML and the CSR's shells; it
  # embeds no result. The reference of each grid is its table in the CSR, parsed
  # from its page on every check (specfirst.machine.csr), never kept in git.
  - id: efficacy-adas
    ars: gold/events/efficacy-adas.json
    schema: gold/spec/ars/ars_ldm.schema.json
    subject_key: USUBJID
    outputs:
      - id: Out14-3-01
        layout: gold/layout/Out14-3-01.yaml
        reference: {csr: gold/reference/csr/CSR.pdf, page: 49, table: "14-3.01"}
      - id: Out14-3-03
        layout: gold/layout/Out14-3-03.yaml
        reference: {csr: gold/reference/csr/CSR.pdf, page: 51, table: "14-3.03"}
      - id: Out14-3-05
        layout: gold/layout/Out14-3-05.yaml
        reference: {csr: gold/reference/csr/CSR.pdf, page: 53, table: "14-3.05"}
      # real-5b: the mixed model for repeated measures, weeks 8, 16 and 24 (ADR-015,
      # amendment of real-5b).
      - id: Out14-3-11
        layout: gold/layout/Out14-3-11.yaml
        reference: {csr: gold/reference/csr/CSR.pdf, page: 59, table: "14-3.11"}
  # real-5b (ADR-012, ADR-015 and its amendment of real-5b): CIBIC+ by category at weeks
  # 8, 16 and 24, LOCF, with the CMH test controlling for the pooled site group. Our own
  # event, written from the SAP and the CSR's shell; it embeds no result.
  - id: efficacy-cibic
    ars: gold/events/efficacy-cibic.json
    schema: gold/spec/ars/ars_ldm.schema.json
    subject_key: USUBJID
    outputs:
      - id: Out14-3-13
        layout: gold/layout/Out14-3-13.yaml
        reference: {csr: gold/reference/csr/CSR.pdf, page: 61, table: "14-3.13"}

# The documents of the kit. `cited_as` is how Pilot 7's claims name them, and how the
# `referenceDocuments` of an ARS file do (issue #31): CDISC's example names the SAP
# CDISCPILOT01_SAP, and its sap.pdf has the SHA-256 of this one (210b7f1f...).
documents:
  - id: sap
    file: inputs/docs/sap.pdf
    cited_as: [spec/source/SAP.pdf, CDISCPILOT01_SAP]
  - id: dataguide
    file: inputs/docs/dataguide.pdf
    cited_as: [spec/source/dataguide.pdf]
  - id: define-adam
    file: inputs/docs/define-adam.xml
    cited_as: [spec/define/define-adam.xml]
  - id: define-sdtm
    file: inputs/data/sdtm/define.xml
    cited_as: [spec/define/define-sdtm.xml]

# ADaM output columns without a complete trace, each with its reason.
trace_gaps: {}


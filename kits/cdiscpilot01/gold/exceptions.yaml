# cells: differences between a grid and its table in the CSR (real-5a, ADR-015;
# specfirst.machine.csr), one list per output. Cells are compared without
# their blanks. An entry has
#   cell      the ID of the cell of the grid
#   csr       the text the CSR prints in the cell
#   class     rule_choice, reference_error or data_difference
#   decision  the decision record the difference is about (gold/decisions/)
#   proof     a kind the check knows, with what it needs:
#               other_pattern  the results of the cell, shown by the patterns
#                              `patterns` (part of the cell -> pattern), give
#                              the CSR's text, and ours is another (the proof
#                              of a rule_choice)
#
# The three outputs of the efficacy tables: the limits of each 95% confidence
# interval of a difference of LS means. SAP template 5 shows them with 2
# decimals, "(xx.xx;xx.xx)", and gold follows the SAP (decision 17 of PLAN.md:
# the documents decide; custom:eff-display-decimals). The CSR prints 1 decimal.
# Our limits, shown with 1 decimal, are the CSR's text in all 9 cells.
#
# real-5b (amendment of real-5b to ADR-015). A second proof kind:
#               other_build    the cell built again with the results of other
#                              analyses of the same event (`analyses`: an
#                              analysis of the cell -> the other one, which
#                              may differ from it only in the options its
#                              decisions set), other `patterns` (another mask,
#                              the text around it the part's own; so for
#                              other_pattern too), another cell `template`
#                              (parts of the cell as {name}, no text of its
#                              own, no format spec) or
#                              another display rule of the registry
#                              (`display`) gives the CSR's text, and ours is
#                              another (the proof of a rule_choice)
#
# Table 14-3.11: gold takes the LS means and their differences at Week 24, as
# SAP 10.1.1 and the title of template 10 say (custom:eff-mmrm-visit). The CSR's
# are the LS means averaged over weeks 8, 16 and 24 (Atorus's hint, evidence
# E22): the analyses An_ADAS_MMRM_*_Avg of the event compute them, and with
# their results every one of the 12 cells is the CSR's text. The limits of the
# confidence intervals are shown with 1 decimal as well (template 10 has 2, the
# CSR 1), and the CSR keeps the sign of -0.04 shown as "-0.0" (the display rule
# display.pattern.signed; gold's display.pattern drops it, custom:eff-mmrm-display).
# Those four entries name both decisions (decision may be a list, real-5b).
#
# Table 14-3.13: SAP ad hoc template 1 shows every count as "xx (xx%)" and a
# p-value as "x.xxx" (custom:eff-cibic-display). The CSR prints a count of 0
# without its percent (21 cells) and the p-values with 4 decimals (3 cells).
cells:
  Out14-3-01:
    - cell: cell:Out14-3-01/r14/c2
      csr: "(-2.1;1.1)"
      class: rule_choice
      decision: custom:eff-display-decimals
      proof: {kind: other_pattern, patterns: {lower: X.X, upper: X.X}}
    - cell: cell:Out14-3-01/r14/c3
      csr: "(-2.7;0.7)"
      class: rule_choice
      decision: custom:eff-display-decimals
      proof: {kind: other_pattern, patterns: {lower: X.X, upper: X.X}}
    - cell: cell:Out14-3-01/r17/c3
      csr: "(-2.2;1.1)"
      class: rule_choice
      decision: custom:eff-display-decimals
      proof: {kind: other_pattern, patterns: {lower: X.X, upper: X.X}}

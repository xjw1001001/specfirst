# Differences between our results and the references of this kit (PLAN.md
# section 4.8). `specfirst check cdiscpilot01` fails on a difference that is
# not listed here, on an entry that is no difference, and on a proof that does
# not hold.
#
# results: one list per result set of kit.yaml. An entry has
#   result    the ID of the ARD row (analysis, operation, groups)
#   embedded  the raw value the reference carries, as it prints it
#   class     rule_choice, reference_error or data_difference
#   proof     a kind the check knows, with what it needs:
#               value_of_other_result  two results are exchanged: the embedded value
#                                      is our value of `result`, which is the same
#                                      analysis and operation in one other group of
#                                      one grouping, and the reference's value of
#                                      `result` is our value of this one
#               same_under_every       our value is the same under every value the
#                                      registry lists for the option `option` of
#                                      the method `method`, and never the embedded
#                                      one; the option must change some result of
#                                      the same operation
#               no_alternative         the other statistics of the same cell are
#                                      reproduced, and under no value the registry
#                                      lists for `option` is our value the embedded
#                                      one; the option must change some result of
#                                      the same operation
#               alternative            with `option` = `value` our value is the
#                                      embedded one (the proof of a rule_choice)
#               between_equal_values   our value is a quartile or a median, and the
#                                      sorted values of the cell between which
#                                      every definition of a sample quantile puts
#                                      it are all our value
#               no_records             the reference embeds no value, we give no
#                                      result, and the counts in `zero` are 0: one
#                                      count of the cell's own groups for every
#                                      group the test compares
#   sources   what else supports the class, for a reader; not checked
#
# common-safety-displays: 25 results of CDISC's example "Common Safety
# Displays" (ARS v1). The first is not in evidence E3: a first quartile that
# agrees with ours as printed ("70" against 70.5) and not at the precision of
# its display pattern. The other 24 are those of E3: 22 values exchanged
# between the low dose and the high dose arm, one median of height, and one
# p-value that is empty. The pilot ADSL and ADAE give our values in both
# engines.
exceptions: 0
results:
  common-safety-displays:
    - result: "ard:An03_01_Age_Summ_ByTrt/Mth02_ContVar_Summ_ByGrp_5_Q1/AnlsGrouping_01_Trt_3"
      embedded: "70"
      class: reference_error
      proof:
        kind: no_alternative
        method: summary.continuous
        option: quantile_definition
      sources:
        - "The high dose arm has 84 subjects. By the SAS default the first quartile is the mean of the 21st and the 22nd age, which are 70 and 71: 70.5. By the R default it is 70.75. The embedded 70 is the 21st age alone."
        - "The example's other quartiles follow the SAS default. In the same arm its third quartile of height, 172.85, is the mean of the 63rd and the 64th value, 172.7 and 173.0."
        - "The example prints the raw value 70 and the formatted value 70.0. Evidence E3 counted this result as reproduced, because 70.5 is within half a unit of a value printed without decimals."
        - "A third definition, which the registry does not list, gives exactly 70: no averaging when n * p is whole (SAS QNTLDEF=3, R type 1). The example does not follow it: of its 69 embedded quartiles and medians for which n * p is whole and the two neighbouring values differ, 68 are the average and this one is the lower value. So the example is at odds with itself (review of real-2, finding F9; counted again in real-3a)."

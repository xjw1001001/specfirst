# formats (issue #31, ADR-022): one list per result set of kit.yaml whose grids are
# compared with the formatted values of its ARS file. A difference of display only:
# the reference's raw value is ours, and its formatted value is not that raw value
# under the pattern of its operation. An entry has
#   result     the ID of the ARD row
#   formatted  the reference's formatted value
#   class      reference_error; rule_choice for the second proof
#   proof      not_its_own_pattern: the reference's raw value under the pattern is
#              our text, and its formatted value is another (specfirst.machine.grid);
#              half_in_floating_error (real-3): the reference's raw value, as written,
#              lies on a half at the decimals of the pattern and is its formatted
#              value; ours is the same number within a relative 1e-9, on the other
#              side of the half; rounded to 12 significant digits first, ours gives
#              the reference's formatted value (grid.half_problem)
#   sources    what else supports the class, for a reader; not checked
#
# Out14-3-2-1: the one Fisher p-value of 1 that the example embeds is formatted "1"
# under its pattern X.XXXX, where every other p-value of the example has four
# decimals (real-3a counted it among the 130 differences of display of the example).
#
# Out14-3-3-1a and Out14-3-3-1b (real-3): 119 minima and maxima of temperature, 59 and
# 60, observed and changed, which the example formats with the decimals of the data
# ("35.33", "-0.56", trailing zeros dropped) under their pattern XX. The example's own
# table shells of the two outputs show "Min, Max" as "XX, XX", and the grids follow the
# pattern. (The SAP's Templates 21 and 22, "for example only", show the minimum and the
# maximum of blood pressure and heart rate without decimals; they do not list
# temperature.) Per recommendation, pending SME review (docs/state/sme-review.md,
# real-3/vs-minmax-decimals). The other 385 of the 504
# minima and maxima of the vital signs are whole numbers and agree. Each result stands
# once, though both grids show it. The entries were written by a script from the build, which
# kept every result whose formatted value is not its raw value under the pattern while
# that raw value under the pattern is our text; the check holds each again.
formats:
  common-safety-displays:
    - result: ard:An07_09_Soc_Comp_ByTrt_PlacLow/Mth03_CatVar_Comp_FishEx_1_pval/*/=VASCULAR%20DISORDERS
      formatted: "1"
      class: reference_error
      proof: {kind: not_its_own_pattern}
      sources:
        - "the operation Mth03_CatVar_Comp_FishEx_1_pval has the resultPattern X.XXXX"

      proof:
        kind: no_alternative
        method: summary.continuous
        option: quantile_definition
      sources:
        - "The high dose arm has 84 subjects. By the SAS default the first quartile is the mean of the 21st and the 22nd age, which are 70 and 71: 70.5. By the R default it is 70.75. The embedded 70 is the 21st age alone."
        - "The example's other quartiles follow the SAS default. In the same arm its third quartile of height, 172.85, is the mean of the 63rd and the 64th value, 172.7 and 173.0."
        - "The example prints the raw value 70 and the formatted value 70.0. Evidence E3 counted this result as reproduced, because 70.5 is within half a unit of a value printed without decimals."

# Layout of the output Out14-3-3-1a of CDISC's ARS example "Common Safety
# Displays": Summary of Observed and Change from Baseline by Scheduled Visits -
# Vital Signs, horizontal (real-3).
#
# Layout spec v0 (specfirst.machine.layout, ADR-003 and its amendments), with the
# columns per group (`columns.within`) and the block kind `by_groups` of real-3. This
# file is our own. It holds what the ARS file does not: that the observed values and
# the changes from baseline stand side by side under each arm, which rows each
# parameter and visit has, the cell templates and the row labels. They follow the
# example's table shell, Vitals_Obs_ChgBaseline_Table_Shell.pdf in the pinned ARS
# repository, which kit.yaml pins and the mock shell is held against: under each
# parameter (the section) and each visit (a row without cells), the rows "n",
# "Mean (SD)", "Median", "Q1, Q3" and "Min, Max"; at baseline the observed value
# only. The changes have no rows at baseline: their data subset leaves out the
# baseline records, so the engine gives a count of 0 there (rule I11), which the
# example does not list.
#
# The patterns are those of the ARS operations, as in the shell: "XX" for n, the
# minimum and the maximum, "XX.X" for the mean, the median and the quartiles,
# "(XX.XX)" for the standard deviation. The example's formatted values show the
# minima and maxima of temperature with the decimals of the data; those differences
# of display are entries of `formats` in gold/exceptions.yaml (proof
# not_its_own_pattern). The note on baseline is the display's Legend section, which
# a grid does not take on its own.
layout: 0
output: Out14-3-3-1a
footnotes:
  - "Note: Baseline is defined as the last assessment that is non-missing prior to first dose of investigational product."
columns:
  grouping: AnlsGrouping_01_Trt
  within:
    - {id: observed, label: Observed}
    - {id: change, label: Change from Baseline}
rows:
  - kind: header
    cell: "{N}"
    parts:
      N: {analysis: An01_05_SAF_Summ_ByTrt, operation: Mth01_CatVar_Count_ByGrp_1_n}
  - kind: by_groups
    by: [AnlsGrouping_08_Param, AnlsGrouping_09_Visit]
    analyses:
      - {analysis: An08_01_Obs_Summ_ByTrt, column: observed}
      - {analysis: An08_02_ChgBl_Summ_ByTrt, column: change, skip: [AnlsGrouping_09_Visit_01]}
    rows:
      - label: n
        cell: "{n}"
        parts:
          n: {operation: Mth02_ContVar_Summ_ByGrp_1_n}
      - label: Mean (SD)
        cell: "{mean} {sd}"
        parts:
          mean: {operation: Mth02_ContVar_Summ_ByGrp_2_Mean}
          sd: {operation: Mth02_ContVar_Summ_ByGrp_3_SD}
      - label: Median
        cell: "{median}"
        parts:
          median: {operation: Mth02_ContVar_Summ_ByGrp_4_Median}
      - label: Q1, Q3
        cell: "{q1}, {q3}"
        parts:
          q1: {operation: Mth02_ContVar_Summ_ByGrp_5_Q1}
          q3: {operation: Mth02_ContVar_Summ_ByGrp_6_Q3}
      - label: Min, Max
        cell: "{min}, {max}"
        parts:
          min: {operation: Mth02_ContVar_Summ_ByGrp_7_Min}
          max: {operation: Mth02_ContVar_Summ_ByGrp_8_Max}
